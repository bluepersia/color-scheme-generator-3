<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Scheme Generator</title>
  </head>
  <body>
    <header class="header">
      <form class="header__form">
        <input class="header__color-picker" type="color" />
        <select class="header__scheme-selector">
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome Dark</option>
          <option value="monochrome-light">Monochrome Light</option>
          <option value="analogic">Analogic</option>
          <option value="complement">Complement</option>
          <option value="analogic-complement">Analogic Complement</option>
          <option value="triad">Triad</option>
        </select>
        <button class="header__get-scheme-button">Get color scheme</button>
      </form>
    </header>

    <main>
      <section class="color-schemes">
        <ul class="color-schemes__list">
          <li class="color-schemes__item">
            <div class="color-schemes__color-box"></div>
            <span class="color-schemes__color-code"></span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
